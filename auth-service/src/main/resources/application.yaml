spring:
  application:
    name: auth

  security:
    oauth2:
      authorizationserver:
        client:
          oidc-client:
            registration:
              client-id: "spring"
              client-secret: "{noop}spring"
              client-authentication-methods:
                - "client_secret_basic"
              authorization-grant-types:
                - "authorization_code"
                - "refresh_token"
              redirect-uris:
                - "http://127.0.0.1:8082/login/oauth2/code/spring"
              scopes:
                - "openid"
                - "profile"

  # PostgreSQL connection managed by Docker Compose (see compose.yaml).
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: myuser
    password: secret

  # Run schema.sql on every startup. Safe because statements use "if not exists".
  sql:
    init:
      mode: always

  # Only start Docker Compose services; don't stop them when the app shuts down.
  docker:
    compose:
      lifecycle-management: start_only
